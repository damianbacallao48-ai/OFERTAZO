<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Control - OFERTAZO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-cyber { font-family: 'Orbitron', monospace; }
  </style>
</head>
<body class="bg-[#05070e] text-slate-100 min-h-screen pb-24 font-sans antialiased">

  <!-- PANTALLA DE ACCESO POR CONTRASEÑA -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#0b1326] border border-amber-500/40 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl text-center">
      <div class="w-14 h-14 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl mx-auto border border-amber-500/30">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h1 class="text-base font-black text-amber-400 font-cyber">PANEL DE CONTROL</h1>
        <p id="auth-biz-name" class="text-xs text-slate-400 mt-1">Cargando negocio...</p>
      </div>
      <div class="space-y-3 pt-2">
        <input id="input-pin" type="password" placeholder="Ingresa tu PIN o contraseña" onkeydown="if(event.key==='Enter') verificarPIN()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-lg text-white font-cyber tracking-widest outline-none focus:border-amber-400">
        <button onclick="verificarPIN()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs uppercase tracking-wider active:scale-95 transition shadow-lg">
          Entrar a Administrar
        </button>
      </div>
    </div>
  </div>

  <!-- PANEL PRINCIPAL DE ADMINISTRACIÓN -->
  <div id="main-panel" class="hidden max-w-xl mx-auto px-3 py-4 space-y-5">
    
    <!-- Cabecera del Panel -->
    <header class="bg-[#080d1a] border border-amber-500/30 rounded-2xl p-3.5 flex items-center justify-between">
      <div>
        <h1 id="panel-biz-name" class="text-sm font-black text-amber-400 font-cyber truncate">MI TIENDA</h1>
        <p class="text-[10px] text-slate-400 font-mono" id="panel-biz-slug"></p>
      </div>
      <div class="flex items-center gap-2">
        <a id="btn-ver-tienda" href="#" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">
          Ver Catálogo
        </a>
        <button onclick="cerrarSesion()" class="bg-slate-800 text-slate-300 px-2.5 py-1.5 rounded-xl text-[10px]">
          Salir
        </button>
      </div>
    </header>

    <!-- BARRA DE PESTAÑAS: SEPARACIÓN DE AJUSTES Y SUBIR PRODUCTOS -->
    <div class="grid grid-cols-2 gap-2 bg-[#080d1a] p-1 rounded-2xl border border-slate-800">
      <button 
        id="tab-btn-ajustes
