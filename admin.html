<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - Control de Negocios y Suscripciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-28 font-sans max-w-lg mx-auto antialiased">

  <header class="flex justify-between items-center py-4 border-b border-slate-800 mb-5">
    <div>
      <h1 class="text-xl font-black text-amber-400">PANEL MAESTRO</h1>
      <p class="text-xs text-slate-400">Control de Pagos y Suscripciones</p>
    </div>
    <a href="registro.html" target="_blank" class="bg-emerald-600 text-xs px-3 py-1.5 rounded-xl text-white font-bold flex items-center gap-1.5 active:scale-95 shadow">
      <i class="fa-solid fa-plus"></i> Registro
    </a>
  </header>

  <!-- LISTA DE TODOS LOS NEGOCIOS REGISTRADOS -->
  <section class="space-y-3 mb-6">
    <div class="flex justify-between items-center px-1">
      <h2 class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-users-gear text-amber-400"></i> Negocios Registrados (<span id="total-biz">0</span>)
      </h2>
      <button onclick="cargarNegocios()" class="text-xs text-cyan-400 font-bold hover:underline">
        <i class="fa-solid fa-rotate"></i> Recargar
      </button>
    </div>

    <div id="lista-negocios" class="space-y-3">
      <div class="text-center py-10 text-slate-500 text-xs">Cargando tiendas...</div>
    </div>
  </section>

  <!-- TASA DE CAMBIO USD -->
  <section class="bg-slate-900 border border-cyan-500/40 rounded-3xl p-4 shadow-xl">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-money-bill-transfer text-cyan-400 text-lg"></i>
        <div>
          <h3 class="text-xs font-black text-white uppercase">Tasa del Dólar (USD / CUP)</h3>
          <p class="text-[10px] text-slate-400">Aplica a todas las tiendas</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input id="input-tasa-usd" type="number" placeholder="320" class="w-20 bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs text-center font-black text-amber-400 outline-none focus:border-cyan-400">
        <button onclick="guardarTasaUSD()" id="btn-tasa" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black px-3 py-2 rounded-xl active:scale-95 transition">
          Actualizar
        </button>
      </div>
    </div>
  </section>

  <script>
    const SUPABASE_URL = "https://qhkqznpgjirvnndriehr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoa3F6bnBnamlydm5uZHJpZWhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTE5NzQsImV4cCI6MjEwNzQ4Nzk3NH0.AHUdASoGr0FJWUuP0LxS9UJ2_-QzFPwAjmEeWZ3g1Uc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let negocios = [];

    async function cargarNegocios() {
      const cont = document.getElementById("lista-negocios");
      const { data, error } = await supabaseClient
        .from('negocios')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        cont.innerHTML = `<div class="text-xs text-red-400 text-center py-4">${error.message}</div>`;
        return;
      }

      negocios = data || [];
      document.getElementById("total-biz").innerText = negocios.length;

      if (negocios.length === 0) {
        cont.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">Aún no hay negocios registrados.</div>';
        return;
      }

      const ahora = new Date();
      let html = '';

      negocios.forEach(b => {
        const vence = new Date(b.fecha_vencimiento);
        const diffDias = Math.ceil((vence - ahora) / (1000 * 60 * 60 * 24));
        const estaVencido = diffDias <= 0 || b.activo === false;

        let badgeEstado = '';
        if (estaVencido) {
          badgeEstado = `<span class="bg-red-500/20 text-red-400 border border-red-500/40 text-[9px] font-bold px-2 py-0.5 rounded-full">SUSPENDIDO / VENCIDO</span>`;
        } else if (b.estado_pago === 'prueba') {
          badgeEstado = `<span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[9px] font-bold px-2 py-0.5 rounded-full">PRUEBA (${diffDias} días)</span>`;
        } else {
          badgeEstado = `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[9px] font-bold px-2 py-0.5 rounded-full">PAGADO (${diffDias} días)</span>`;
        }

        html += `<div class="bg-slate-900 border ${estaVencido ? 'border-red-900/60' : 'border-slate-800'} rounded-2xl p-3.5 space-y-2.5 shadow-md">
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-bold text-white">${b.nombre}</h3>
                ${badgeEstado}
              </div>
              <p class="text-[11px] text-cyan-400 font-mono mt-0.5">?tienda=${b.slug}</p>
              <p class="text-[10px] text-slate-400">WA: +${b.telefono_whatsapp} • PIN: <strong class="text-amber-300 font-mono">${b.pin_admin}</strong></p>
            </div>
            <!-- Botones de acceso directo -->
            <div class="flex items-center gap-1.5">
              <a href="panel.html?tienda=${b.slug}" target="_blank" title="Editar Productos" class="p-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs flex items-center gap-1 shadow">
                <i class="fa-solid fa-pen-to-square"></i> Editar
              </a>
              <a href="index.html?tienda=${b.slug}" target="_blank" title="Ver Tienda Cliente" class="p-2 bg-slate-800 text-slate-300 rounded-xl text-xs border border-slate-700">
                <i class="fa-solid fa-eye"></i>
              </a>
            </div>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-800 text-xs">
            <div class="flex items-center gap-1.5">
              <button onclick="renovar30Dias(${b.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2.5 py-1 rounded-xl text-[10px] active:scale-95 flex items-center gap-1">
                <i class="fa-solid fa-check-circle"></i> Aprobar +30 Días
              </button>
              <button onclick="toggleActivo(${b.id}, ${b.activo})" class="bg-slate-800 text-slate-300 font-bold px-2.5 py-1 rounded-xl text-[10px] border border-slate-700 active:scale-95">
                ${b.activo ? 'Pausar' : 'Reactivar'}
              </button>
            </div>
            <button onclick="eliminarNegocio(${b.id})" class="text-red-400 text-xs p-1 hover:text-red-300"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`;
      });

      cont.innerHTML = html;
    }

    async function renovar30Dias(id) {
      if (!confirm("¿Confirmas que este cliente pagó y deseas activar/extender 30 días de suscripción?")) return;

      const nuevaFecha = new Date();
      nuevaFecha.setDate(nuevaFecha.getDate() + 30);

      const { error } = await supabaseClient
        .from('negocios')
        .update({
          activo: true,
          estado_pago: 'pagado',
          fecha_vencimiento: nuevaFecha.toISOString()
        })
        .eq('id', id);

      if (error) {
        alert("Error renovando: " + error.message);
      } else {
        alert("¡Negocio renovado exitosamente por 30 días!");
        cargarNegocios();
      }
    }

    async function toggleActivo(id, act) {
      await supabaseClient.from('negocios').update({ activo: !act }).eq('id', id);
      cargarNegocios();
    }

    async function eliminarNegocio(id) {
      if (!confirm("¿Deseas eliminar este negocio y todos sus productos?")) return;
      await supabaseClient.from('negocios').delete().eq('id', id);
      cargarNegocios();
    }

    async function cargarTasaUSD() {
      try {
        const { data } = await supabaseClient.from('configuracion').select('*').eq('clave', 'tasa_usd').single();
        if (data && data.valor) document.getElementById("input-tasa-usd").value = data.valor;
      } catch (e) {}
    }

    async function guardarTasaUSD() {
      const v = document.getElementById("input-tasa-usd").value;
      await supabaseClient.from('configuracion').upsert({ clave: 'tasa_usd', valor: String(v) });
      alert("Tasa actualizada.");
    }

    cargarTasaUSD();
    cargarNegocios();
  </script>
</body>
</html>
