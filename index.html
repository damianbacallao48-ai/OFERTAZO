<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFERTAZO - Catálogo Digital Ciego de Ávila</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-soft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .animate-badge { animation: pulse-soft 3s infinite ease-in-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-32 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">

  <!-- Header Dinámico -->
  <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 px-4 py-3.5 shadow-xl">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div>
          <h1 class="text-lg font-black tracking-wider text-amber-400">OFERTAZO</h1>
          <p class="text-[11px] text-slate-400 font-medium flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Ciego de Ávila | Solo Domicilio
          </p>
        </div>
      </div>
      <button onclick="abrirModalAcerca()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 transition flex items-center gap-1.5 active:scale-95">
        <i class="fa-solid fa-store text-amber-400"></i> Info & Horarios
      </button>
    </div>
  </header>

  <!-- Banner Informativo -->
  <section class="max-w-xl mx-auto px-4 pt-4">
    <div class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-amber-500/20 via-orange-500/10 to-transparent p-5 border border-amber-500/20 backdrop-blur">
      <div class="relative z-10 space-y-2">
        <div class="flex flex-wrap gap-2">
          <span class="inline-flex items-center gap-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full animate-badge">
            🛵 Mensajería fija
