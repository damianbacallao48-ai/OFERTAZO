<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="firebase-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-28">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30 px-4 py-3 shadow-lg">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-utensils"></i> Menú Digital
        </h1>
        <p class="text-xs text-gray-400">Pedidos directos a WhatsApp</p>
      </div>
      <div id="status-badge" class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-900/60 text-emerald-400 border border-emerald-700">
        ● Abierto
      </div>
    </div>
  </header>

  <!-- Filtro por Categorías -->
  <nav class="sticky top-14 z-20 bg-gray-900/95 backdrop-blur px-4 py-3 border-b border-gray-800">
    <div class="max-w-xl mx-auto flex gap-2 overflow-x-auto no-scrollbar" id="categories-bar">
      <button onclick="filtrarCategoria('todos')" class="cat-btn active bg-amber-500 text-gray-900 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">
        Todos
      </button>
      <button onclick="filtrarCategoria('platos')" class="cat-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">
        Platos Fuertes
      </button>
      <button onclick="filtrarCategoria('bebidas')" class="cat-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">
        Bebidas
      </button>
      <button onclick="filtrarCategoria('postres')" class="cat-btn bg-gray-800 text-gray-300 px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap">
        Postres
      </button>
    </div>
  </nav>

  <!-- Catálogo de Productos -->
  <main class="max-w-xl mx-auto px-4 py-4 space-y-4" id="products-list">
    <div class="text-center py-12 text-gray-500">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500 mb-2"></i>
      <p>Cargando menú en tiempo real...</p>
    </div>
  </main>

  <!-- Barra Flotante de Carrito -->
  <div id="cart-bar" class="fixed bottom-4 left-4 right-4 max-w-xl mx-auto hidden z-40">
    <button onclick="abrirModalCarrito()" class="w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold py-3.5 px-6 rounded-2xl shadow-2xl flex justify-between items-center transition transform active:scale-95">
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-bag-shopping text-lg"></i>
        <span id="cart-count" class="bg-gray-900 text-amber-400 text-xs px-2 py-0.5 rounded-full font-extrabold">0</span>
        Ver mi pedido
      </span>
      <span id="cart-total" class="text-lg font-black">$0 CUP</span>
    </button>
  </div>

  <!-- Modal Checkout -->
  <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-gray-800 w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col border border-gray-700">
      <div class="p-4 border-b border-gray-700 flex justify-between items-center">
        <h2 class="text-lg font-bold text-amber-400">Detalles de tu Orden</h2>
        <button onclick="cerrarModalCarrito()" class="text-gray-400 hover:text-white text-xl">✕</button>
      </div>

      <div class="p-4 overflow-y-auto flex-1 space-y-4">
        <!-- Lista de Items en carrito -->
        <div id="cart-items" class="space-y-3"></div>

        <!-- Formulario del Cliente -->
        <div class="pt-4 border-t border-gray-700 space-y-3">
          <div>
            <label class="text-xs text-gray-400">Nombre de quien recibe:</label>
            <input id="client-name" type="text" placeholder="Ej. Carlos Martínez" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm mt-1 focus:border-amber-400 outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-400">Tipo de entrega:</label>
            <select id="delivery-type" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm mt-1 focus:border-amber-400 outline-none">
              <option value="Delivery (A domicilio)">🛵 Delivery (A domicilio)</option>
              <option value="Recoger en local">🛍️ Recoger en local</option>
              <option value="Para consumir en el local">🍽️ Consumir en el local</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-gray-400">Dirección o Número de Mesa:</label>
            <input id="client-address" type="text" placeholder="Calle, número, entrecalles o mesa" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm mt-1 focus:border-amber-400 outline-none">
          </div>
          <div>
            <label class="text-xs text-gray-400">Método de pago:</label>
            <select id="payment-method" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm mt-1 focus:border-amber-400 outline-none">
              <option value="Efectivo">Efectivo al recibir</option>
              <option value="Transferencia EnZona / Transfermóvil">Transferencia (Transfermóvil / EnZona)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="p-4 border-t border-gray-700 bg-gray-850">
        <button onclick="finalizarYEnviarWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg">
          <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido a WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script>
    const MI_WHATSAPP = "5358960660";
    let productos = [];
    let carrito = [];
    let categoriaSeleccionada = 'todos';

    // Conexión en tiempo real con Firestore
    db.collection("productos").onSnapshot((snapshot) => {
      productos = [];
      snapshot.forEach((doc) => {
        productos.push({ id: doc.id, ...doc.data() });
      });
      renderizarProductos();
    });

    function filtrarCategoria(cat) {
      categoriaSeleccionada = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-gray-900');
        btn.classList.add('bg-gray-800', 'text-gray-300');
      });
      event.target.classList.add('bg-amber-500', 'text-gray-900');
      renderizarProductos();
    }

    function renderizarProductos() {
      const contenedor = document.getElementById("products-list");
      const filtrados = categoriaSeleccionada === 'todos' 
        ? productos 
        : productos.filter(p => p.categoria === categoriaSeleccionada);

      if (filtrados.length === 0) {
        contenedor.innerHTML = `<div class="text-center py-10 text-gray-500">No hay productos disponibles por ahora.</div>`;
        return;
      }

      contenedor.innerHTML = filtrados.map(prod => `
        <div class="bg-gray-800 rounded-2xl p-3 flex gap-3 border border-gray-700 shadow-md ${!prod.disponible ? 'opacity-50' : ''}">
          <img src="${prod.imagen || 'https://via.placeholder.com/150'}" class="w-24 h-24 object-cover rounded-xl bg-gray-700" alt="${prod.nombre}">
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-100">${prod.nombre}</h3>
              <p class="text-xs text-gray-400 line-clamp-2 mt-0.5">${prod.descripcion || ''}</p>
            </div>
            <div class="flex items-center justify-between mt-2">
              <span class="text-amber-400 font-extrabold text-base">$${prod.precio} CUP</span>
              ${prod.disponible 
                ? `<button onclick="agregarAlCarrito('${prod.id}')" class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1">
                    <i class="fa-solid fa-plus"></i> Agregar
                   </button>`
                : `<span class="text-red-400 text-xs font-bold bg-red-950/40 px-2 py-1 rounded">Agotado</span>`
              }
            </div>
          </div>
        </div>
      `).join('');
    }

    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      const existe = carrito.find(item => item.id === id);
      if (existe) {
        existe.cantidad += 1;
      } else {
        carrito.push({ ...prod, cantidad: 1 });
      }
      actualizarBarraCarrito();
    }

    function cambiarCantidad(id, delta) {
      const item = carrito.find(p => p.id === id);
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) {
        carrito = carrito.filter(p => p.id !== id);
      }
      actualizarBarraCarrito();
      renderizarModalItems();
    }

    function actualizarBarraCarrito() {
      const totalCount = carrito.reduce((sum, item) => sum + item.cantidad, 0);
      const totalPrice = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
      
      const bar = document.getElementById("cart-bar");
      if (totalCount > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cart-count").innerText = totalCount;
        document.getElementById("cart-total").innerText = `$${totalPrice} CUP`;
      } else {
        bar.classList.add("hidden");
        cerrarModalCarrito();
      }
    }

    function abrirModalCarrito() {
      document.getElementById("cart-modal").classList.remove("hidden");
      renderizarModalItems();
    }

    function cerrarModalCarrito() {
      document.getElementById("cart-modal").classList.add("hidden");
    }

    function renderizarModalItems() {
      const contenedor = document.getElementById("cart-items");
      if (carrito.length === 0) {
        cerrarModalCarrito();
        return;
      }
      contenedor.innerHTML = carrito.map(item => `
        <div class="flex items-center justify-between bg-gray-900 p-2.5 rounded-xl border border-gray-700 text-sm">
          <div>
            <p class="font-bold">${item.nombre}</p>
            <p class="text-xs text-amber-400 font-semibold">$${item.precio * item.cantidad} CUP</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="cambiarCantidad('${item.id}', -1)" class="w-7 h-7 bg-gray-800 text-gray-300 rounded-lg font-bold">-</button>
            <span class="w-5 text-center font-bold">${item.cantidad}</span>
            <button onclick="cambiarCantidad('${item.id}', 1)" class="w-7 h-7 bg-amber-500 text-gray-950 rounded-lg font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    function finalizarYEnviarWhatsApp() {
      const nombre = document.getElementById("client-name").value.trim();
      const tipoEntrega = document.getElementById("delivery-type").value;
      const direccion = document.getElementById("client-address").value.trim();
      const metodoPago = document.getElementById("payment-method").value;

      if (!nombre) {
        alert("Por favor, introduce tu nombre.");
        return;
      }
      if (!direccion) {
        alert("Por favor, introduce la dirección o número de mesa.");
        return;
      }

      let total = 0;
      let mensaje = `*🛵 NUEVO PEDIDO - MENÚ DIGITAL*\n\n`;
      mensaje += `👤 *Cliente:* ${nombre}\n`;
      mensaje += `📦 *Tipo:* ${tipoEntrega}\n`;
      mensaje += `📍 *Ubicación:* ${direccion}\n`;
      mensaje += `💳 *Pago:* ${metodoPago}\n\n`;
      mensaje += `📋 *DETALLE DEL PEDIDO:*\n`;

      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        mensaje += `• ${item.cantidad}x ${item.nombre} ($${subtotal} CUP)\n`;
      });

      mensaje += `\n💰 *TOTAL A PAGAR: $${total} CUP*`;

      const url = `https://wa.me/${MI_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
