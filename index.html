<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFERTAZO - Online Shopping & Digital Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-28 font-sans max-w-lg mx-auto antialiased">

  <!-- CABECERA CON TU LOGO OFICIAL -->
  <header class="text-center py-6 border-b border-slate-800/80 mb-6 space-y-3">
    <div class="flex justify-center">
      <!-- Contenedor del logo con un toque neón sutil acorde a tu imagen -->
      <div class="w-20 h-20 rounded-3xl bg-slate-900 border border-amber-500/40 flex items-center justify-center shadow-lg shadow-amber-500/10">
        <i class="fa-solid fa-cube text-3xl text-amber-400"></i>
      </div>
    </div>
    <div>
      <h1 class="text-2xl font-black text-white tracking-widest">OFERTAZO</h1>
      <p class="text-[11px] text-cyan-400 tracking-wider font-semibold uppercase mt-0.5">Online Shopping & Digital Catalog</p>
      <p class="text-xs text-slate-400 mt-1">El centro comercial digital de Ciego de Ávila</p>
    </div>

    <!-- Botones principales de acción -->
    <div class="flex gap-2 justify-center pt-2">
      <a href="registro.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-4 py-2.5 rounded-xl text-white font-bold flex items-center gap-1.5 active:scale-95 shadow transition">
        <i class="fa-solid fa-store"></i> Crear mi Tienda
      </a>
      <a href="admin.html" target="_blank" class="bg-slate-900 hover:bg-slate-800 text-xs px-4 py-2.5 rounded-xl text-amber-400 border border-amber-500/30 font-bold flex items-center gap-1.5 active:scale-95 shadow transition">
        <i class="fa-solid fa-user-shield"></i> Admin
      </a>
    </div>
  </header>

  <!-- BUSCADOR GENERAL -->
  <div class="mb-4 relative">
    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i>
    <input id="buscador-general" type="text" placeholder="Buscar tiendas, productos o servicios..." oninput="filtrarDirectorio()" class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400 shadow-inner">
  </div>

  <!-- FILTROS DE CATEGORÍAS -->
  <div class="flex gap-2 overflow-x-auto pb-2 mb-6 scrollbar-none">
    <button onclick="cambiarCat('todos')" id="btn-cat-todos" class="px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950 shrink-0 transition">Todas</button>
    <button onclick="cambiarCat('Gastronomía')" id="btn-cat-Gastronomía" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">🍔 Gastronomía</button>
    <button onclick="cambiarCat('Tecnología')" id="btn-cat-Tecnología" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">📱 Tecnología</button>
    <button onclick="cambiarCat('Ropa y Calzado')" id="btn-cat-Ropa y Calzado" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">👕 Ropa y Calzado</button>
    <button onclick="cambiarCat('Servicios')" id="btn-cat-Servicios" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">⚙️ Servicios</button>
  </div>

  <!-- LISTA DE NEGOCIOS DISPONIBLES -->
  <section class="space-y-3 mb-8">
    <div class="flex justify-between items-center px-1">
      <h2 class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-store text-amber-400"></i> Tiendas Activas (<span id="total-directorio">0</span>)
      </h2>
      <button onclick="cargarDirectorio()" class="text-xs text-cyan-400 font-bold hover:underline">
        <i class="fa-solid fa-rotate"></i> Actualizar
      </button>
    </div>

    <div id="grid-directorio" class="space-y-3">
      <div class="text-center py-12 text-slate-500 text-xs">Cargando directorio de tiendas...</div>
    </div>
  </section>

  <!-- SECCIÓN DE OPINIONES DE LA PLATAFORMA -->
  <section class="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl space-y-4 mb-6">
    <div class="flex justify-between items-center">
      <h3 class="text-xs font-black text-amber-400 uppercase flex items-center gap-1.5">
        <i class="fa-solid fa-comments"></i> Opiniones sobre la Plataforma
      </h3>
      <button onclick="abrirModalOpinion()" class="text-[11px] text-cyan-400 font-bold hover:underline">
        + Dejar Opinión
      </button>
    </div>

    <div id="lista-opiniones" class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
      <div class="text-center py-4 text-slate-500 text-xs">Cargando opiniones...</div>
    </div>
  </section>

  <!-- MODAL DE OPINIÓN -->
  <div id="modal-opinion" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-5 w-full max-w-xs space-y-3 shadow-2xl">
      <h3 class="text-sm font-black text-white text-center">¿Qué opinas de OFERTAZO?</h3>
      <input id="input-nombre-op" type="text" placeholder="Tu Nombre o Negocio" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-amber-400">
      <textarea id="input-texto-op" rows="3" placeholder="Escribe tu comentario..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-amber-400 resize-none"></textarea>
      <div class="flex gap-2 pt-1">
        <button onclick="enviarOpinion()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-2 rounded-xl text-xs uppercase tracking-wider transition">Publicar</button>
        <button onclick="cerrarModalOpinion()" class="px-3 bg-slate-800 text-slate-300 font-bold py-2 rounded-xl text-xs">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://qhkqznpgjirvnndriehr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ih_3RgWJTptRasXqF9UcxQ_eTkkw7j-";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let listadoNegocios = [];
    let categoriaSeleccionada = 'todos';

    // Soporte opcional por si alguien entra directo a una tienda individual con ?tienda=slug
    const urlParams = new URLSearchParams(window.location.search);
    const slugTienda = urlParams.get('tienda');

    if (slugTienda) {
      // Si hay parámetro de tienda, redirigimos o cargamos la vista de tienda individual
      // Puedes mantener tu lógica de tienda individual aquí o dejar que cargue el directorio general.
    }

    window.onload = () => {
      cargarDirectorio();
      cargarOpiniones();
    };

    async function cargarDirectorio() {
      const { data, error } = await supabaseClient
        .from('negocios')
        .select('*')
        .eq('activo', true)
        .order('id', { ascending: false });

      if (error) {
        document.getElementById("grid-directorio").innerHTML = `<div class="text-xs text-red-400 text-center py-4">Error cargando tiendas.</div>`;
        return;
      }

      listadoNegocios = data || [];
      renderizarDirectorio(listadoNegocios);
    }

    function renderizarDirectorio(lista) {
      const grid = document.getElementById("grid-directorio");
      document.getElementById("total-directorio").innerText = lista.length;

      if (lista.length === 0) {
        grid.innerHTML = '<div class="text-xs text-slate-500 text-center py-8">No hay negocios registrados en esta categoría.</div>';
        return;
      }

      let html = '';
      lista.forEach(t => {
        const cat = t.categoria || 'General';
        html += `
          <div class="bg-slate-900 border border-slate-800 hover:border-amber-500/40 rounded-2xl p-4 transition shadow-md flex justify-between items-center">
            <div class="space-y-1">
              <span class="bg-slate-800 text-amber-400 border border-slate-700 text-[9px] font-bold px-2 py-0.5 rounded-full">${cat}</span>
              <h3 class="text-sm font-bold text-white">${t.nombre}</h3>
              <p class="text-[11px] text-slate-400">${t.descripcion || 'Tienda digital en OFERTAZO.'}</p>
              <p class="text-[10px] text-emerald-400 font-mono"><i class="fa-brands fa-whatsapp"></i> +${t.telefono_whatsapp || ''}</p>
            </div>
            <!-- Enlace para visitar la tienda añadiendo ?tienda=slug -->
            <a href="index.html?tienda=${t.slug}" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs shadow shrink-0 flex items-center gap-1 active:scale-95 transition">
              Visitar <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function cambiarCat(cat) {
      categoriaSeleccionada = cat;
      ['todos', 'Gastronomía', 'Tecnología', 'Ropa y Calzado', 'Servicios'].forEach(c => {
        const btn = document.getElementById(`btn-cat-${c}`);
        if(btn) {
          if(c === cat) {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950 shrink-0 transition";
          } else {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition";
          }
        }
      });
      filtrarDirectorio();
    }

    function filtrarDirectorio() {
      const query = document.getElementById("buscador-general").value.toLowerCase();
      const filtrados = listadoNegocios.filter(t => {
        const coincideCat = categoriaSeleccionada === 'todos' || t.categoria === categoriaSeleccionada;
        const coincideTexto = t.nombre.toLowerCase().includes(query) || (t.descripcion && t.descripcion.toLowerCase().includes(query));
        return coincideCat && coincideTexto;
      });
      renderizarDirectorio(filtrados);
    }

    async function cargarOpiniones() {
      const cont = document.getElementById("lista-opiniones");
      try {
        const { data } = await supabaseClient
          .from('comentarios_plataforma')
          .select('*')
          .order('id', { ascending: false })
          .limit(10);

        if (!data || data.length === 0) {
          cont.innerHTML = '<div class="text-xs text-slate-500 text-center py-3">Sé el primero en opinar sobre la plataforma.</div>';
          return;
        }

        let html = '';
        data.forEach(op => {
          html += `
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-2.5 space-y-1">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-amber-400">${op.nombre}</span>
                <span class="text-[9px] text-slate-500">${new Date(op.created_at || Date.now()).toLocaleDateString()}</span>
              </div>
              <p class="text-[11px] text-slate-300">${op.comentario}</p>
            </div>
          `;
        });
        cont.innerHTML = html;
      } catch (e) {
        cont.innerHTML = '<div class="text-xs text-slate-500 text-center py-3">Sin opiniones aún.</div>';
      }
    }

    function abrirModalOpinion() {
      document.getElementById("modal-opinion").classList.remove("hidden");
      document.getElementById("modal-opinion").classList.add("flex");
    }

    function cerrarModalOpinion() {
      document.getElementById("modal-opinion").classList.add("hidden");
      document.getElementById("modal-opinion").classList.remove("flex");
    }

    async function enviarOpinion() {
      const nombre = document.getElementById("input-nombre-op").value.trim();
      const comentario = document.getElementById("input-texto-op").value.trim();

      if (!nombre || !comentario) {
        alert("Por favor completa tu nombre y tu comentario.");
        return;
      }

      const { error } = await supabaseClient
        .from('comentarios_plataforma')
        .insert([{ nombre, comentario }]);

      if (error) {
        alert("⚠️ Recuerda crear la tabla 'comentarios_plataforma' en Supabase. Error: " + error.message);
      } else {
        alert("¡Opinión publicada con éxito!");
        document.getElementById("input-nombre-op").value = '';
        document.getElementById("input-texto-op").value = '';
        cerrarModalOpinion();
        cargarOpiniones();
      }
    }
  </script>
</body>
</html>
