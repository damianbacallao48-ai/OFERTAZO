<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFERTAZO - Catálogo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-28 font-sans max-w-lg mx-auto antialiased">

  <!-- ================= VISTA DE LA TIENDA (DISEÑO ORIGINAL EXACTO) ================= -->
  <div id="vista-tienda" class="space-y-4">
    
    <!-- BANNER SUPERIOR DE LA TIENDA CON PORTADA Y LOGO -->
    <div class="relative bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
      <!-- Imagen de portada de la tienda -->
      <div class="w-full h-36 bg-slate-900 relative">
        <img id="tienda-portada" src="" class="w-full h-full object-cover hidden" alt="Portada">
        <div id="tienda-portada-placeholder" class="w-full h-full bg-gradient-to-r from-purple-900 via-indigo-950 to-slate-900 flex items-center justify-center">
          <i class="fa-solid fa-store text-4xl text-amber-400/50"></i>
        </div>
      </div>

      <!-- Contenido del perfil de la tienda -->
      <div class="p-5 text-center -mt-12 relative space-y-3">
        <!-- Logo / Avatar -->
        <div class="w-20 h-20 rounded-2xl bg-slate-950 border-2 border-amber-500/50 flex items-center justify-center mx-auto text-amber-400 text-3xl font-black shadow-xl overflow-hidden" id="tienda-avatar-container">
          <i class="fa-solid fa-store" id="tienda-avatar-icon"></i>
        </div>

        <div>
          <h1 id="tienda-nombre" class="text-xl font-black text-amber-400">Cargando tienda...</h1>
          <p id="tienda-desc" class="text-xs text-slate-400 mt-0.5">...</p>
        </div>

        <!-- Botones de Acción (Admin, Crear Tienda, Difundir / WhatsApp) -->
        <div class="grid grid-cols-3 gap-2 pt-1">
          <a href="admin.html" target="_blank" class="bg-slate-950 hover:bg-slate-900 border border-amber-500/30 text-amber-400 text-xs py-2.5 rounded-2xl font-bold flex items-center justify-center gap-1 shadow transition">
            <i class="fa-solid fa-gear"></i> Admin
          </a>
          <a href="registro.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2.5 rounded-2xl font-bold flex items-center justify-center gap-1 shadow transition">
            <i class="fa-solid fa-store"></i> Crear Tienda
          </a>
          <a id="link-whatsapp-tienda" href="#" target="_blank" class="bg-slate-950 hover:bg-slate-900 border border-slate-800 text-slate-200 text-xs py-2.5 rounded-2xl font-bold flex items-center justify-center gap-1 shadow transition">
            <i class="fa-solid fa-share-nodes text-cyan-400"></i> Difundir
          </a>
        </div>
      </div>
    </div>

    <!-- SECCIÓN "OTROS NEGOCIOS" (CARRUSEL HORIZONTAL CON IMÁGENES) -->
    <div class="space-y-2 pt-1">
      <div class="flex justify-between items-center px-1">
        <span class="text-[11px] font-black text-cyan-400 uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-bolt text-amber-400"></i> OTROS NEGOCIOS
        </span>
        <!-- Botón que enlaza a tu directorio.html que creamos antes -->
        <a href="directorio.html" class="text-[10px] text-amber-400 hover:underline font-bold">Ver Directorio ></a>
      </div>
      
      <!-- Carrusel -->
      <div id="carrusel-otros-negocios" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
        <div class="text-xs text-slate-500 py-3 px-4">Cargando negocios...</div>
      </div>
    </div>

    <!-- BUSCADOR DE PRODUCTOS -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i>
      <input id="buscador-productos" type="text" placeholder="Buscar producto, plato o servicio en esta tienda.." oninput="filtrarProductos()" class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-11 pr-4 py-3 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400 shadow-inner">
    </div>

    <!-- FILTROS DE CATEGORÍAS DE PRODUCTOS -->
    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
      <button onclick="filtrarCatProductos('todos')" id="btn-cat-all" class="px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950 shrink-0 transition">🔥 Todos</button>
      <button onclick="filtrarCatProductos('Confituras')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">Confituras</button>
      <button onclick="filtrarCatProductos('Comida')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">Comida</button>
      <button onclick="filtrarCatProductos('Bebidas')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">Bebidas</button>
    </div>

    <!-- GRID DE PRODUCTOS (ESTÉTICA ORIGINAL CON FOTOS Y PRECIOS) -->
    <div id="grid-productos" class="grid grid-cols-2 gap-3 pt-1">
      <div class="col-span-2 text-center py-12 text-slate-500 text-xs">Cargando productos...</div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://qhkqznpgjirvnndriehr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ih_3RgWJTptRasXqF9UcxQ_eTkkw7j-";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productosTiendaActual = [];

    // Detectar qué tienda mostrar mediante ?tienda=slug (Si no hay, por defecto muestra la tienda principal o la última)
    const urlParams = new URLSearchParams(window.location.search);
    let slugTienda = urlParams.get('tienda');

    window.onload = async () => {
      // Si no se especifica tienda en la URL, cargamos por defecto la tienda "tupunto" o la primera activa
      if (!slugTienda) {
        slugTienda = 'tupunto'; 
      }
      await cargarTiendaIndividual(slugTienda);
    };

    async function cargarTiendaIndividual(slug) {
      // Buscar la tienda por slug, o si falla, buscar la primera disponible
      let { data: negocio, error } = await supabaseClient
        .from('negocios')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !negocio) {
        // Fallback: traer la primera tienda activa
        const { data: listado } = await supabaseClient
          .from('negocios')
          .select('*')
          .eq('activo', true)
          .limit(1);
        
        if (listado && listado.length > 0) {
          negocio = listado[0];
        } else {
          document.getElementById("tienda-nombre").innerText = "No hay tiendas activas";
          document.getElementById("tienda-desc").innerText = "Crea una tienda desde el panel de administración.";
          return;
        }
      }

      // Rellenar datos del perfil de la tienda
      document.getElementById("tienda-nombre").innerText = negocio.nombre;
      document.getElementById("tienda-desc").innerText = negocio.descripcion || negocio.municipio || 'Ciego de Ávila';

      // Manejar portada si existe
      if (negocio.portada_url) {
        const imgPortada = document.getElementById("tienda-portada");
        imgPortada.src = negocio.portada_url;
        imgPortada.classList.remove("hidden");
        document.getElementById("tienda-portada-placeholder").classList.add("hidden");
      }

      // Manejar logo / avatar si existe
      if (negocio.logo_url) {
        document.getElementById("tienda-avatar-container").innerHTML = `<img src="${negocio.logo_url}" class="w-full h-full object-cover rounded-2xl" alt="Logo">`;
      } else {
        document.getElementById("tienda-avatar-icon").className = "fa-solid fa-store";
      }

      // Enlace de WhatsApp
      if (negocio.telefono_whatsapp) {
        document.getElementById("link-whatsapp-tienda").href = `https://wa.me/${negocio.telefono_whatsapp}`;
      } else {
        document.getElementById("link-whatsapp-tienda").style.display = 'none';
      }

      // Cargar productos de esta tienda y el carrusel de otros negocios
      cargarProductosTienda(negocio.id);
      cargarCarruselOtrosNegocios(negocio.id);
    }

    async function cargarCarruselOtrosNegocios(currentId) {
      const { data } = await supabaseClient
        .from('negocios')
        .select('*')
        .eq('activo', true)
        .neq('id', currentId)
        .limit(6);

      const cont = document.getElementById("carrusel-otros-negocios");
      if (!data || data.length === 0) {
        cont.innerHTML = '<span class="text-xs text-slate-500 py-2">No hay más negocios por ahora.</span>';
        return;
      }

      let html = '';
      data.forEach(n => {
        const logoHtml = n.logo_url 
          ? `<img src="${n.logo_url}" class="w-full h-full object-cover">` 
          : `<div class="w-full h-full bg-slate-900 flex items-center justify-center text-amber-400 font-bold">${n.nombre.charAt(0)}</div>`;

        html += `
          <a href="index.html?tienda=${n.slug}" class="bg-slate-900 border border-slate-800 hover:border-amber-400/60 rounded-2xl p-2.5 shrink-0 w-32 text-center space-y-1.5 shadow transition">
            <div class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-800 mx-auto overflow-hidden shadow-inner flex items-center justify-center">
              ${logoHtml}
            </div>
            <h4 class="text-xs font-bold text-white truncate">${n.nombre}</h4>
            <span class="text-[9px] text-amber-400 font-black tracking-wider block">VER TIENDA</span>
          </a>
        `;
      });
      cont.innerHTML = html;
    }

    async function cargarProductosTienda(negocioId) {
      const { data, error } = await supabaseClient
        .from('productos')
        .select('*')
        .eq('negocio_id', negocioId)
        .order('id', { ascending: false });

      if (error) {
        document.getElementById("grid-productos").innerHTML = '<div class="col-span-2 text-center text-red-400 text-xs">Error cargando productos.</div>';
        return;
      }

      productosTiendaActual = data || [];
      renderizarProductos(productosTiendaActual);
    }

    function renderizarProductos(lista) {
      const grid = document.getElementById("grid-productos");
      if (lista.length === 0) {
        grid.innerHTML = '<div class="col-span-2 text-center text-slate-500 text-xs py-12">No hay productos en este catálogo.</div>';
        return;
      }

      let html = '';
      lista.forEach(p => {
        const catBadge = p.categoria ? `<span class="absolute top-2 left-2 bg-slate-950/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-[9px] font-bold px-2 py-0.5 rounded-full uppercase">${p.categoria}</span>` : '';
        
        html += `
          <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-3 space-y-2 shadow-md relative flex flex-col justify-between">
            <div class="relative">
              ${p.imagen_url ? `<img src="${p.imagen_url}" class="w-full h-32 object-cover rounded-xl" alt="Producto">` : `<div class="w-full h-32 bg-slate-950 rounded-xl flex items-center justify-center text-slate-700"><i class="fa-solid fa-box text-2xl"></i></div>`}
              ${catBadge}
            </div>
            <div class="space-y-1">
              <h3 class="text-xs font-bold text-white line-clamp-2">${p.nombre}</h3>
              <p class="text-xs font-black text-amber-400">$${p.precio}</p>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function filtrarProductos() {
      const q = document.getElementById("buscador-productos").value.toLowerCase();
      const filtrados = productosTiendaActual.filter(p => p.nombre.toLowerCase().includes(q));
      renderizarProductos(filtrados);
    }

    function filtrarCatProductos(cat) {
      if(cat === 'todos') {
        renderizarProductos(productosTiendaActual);
      } else {
        const filtrados = productosTiendaActual.filter(p => p.categoria && p.categoria.toLowerCase() === cat.toLowerCase());
        renderizarProductos(filtrados);
      }
    }
  </script>
</body>
</html>
