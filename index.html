<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OFERTAZO - Catálogo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-28 font-sans max-w-lg mx-auto antialiased">

  <div class="space-y-4">
    
    <!-- BANNER SUPERIOR DE LA TIENDA (CON PORTADA, LOGO Y BOTONES) -->
    <div class="relative bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
      <!-- Imagen de portada -->
      <div class="w-full h-36 bg-slate-900 relative">
        <img id="tienda-portada" src="" class="w-full h-full object-cover hidden" alt="Portada">
        <div id="tienda-portada-placeholder" class="w-full h-full bg-gradient-to-r from-purple-900 via-indigo-950 to-slate-900 flex items-center justify-center">
          <i class="fa-solid fa-store text-4xl text-amber-400/40"></i>
        </div>
      </div>

      <!-- Info y Botones -->
      <div class="p-5 text-center -mt-12 relative space-y-3">
        <!-- Logo / Avatar -->
        <div class="w-20 h-20 rounded-2xl bg-slate-950 border-2 border-amber-500/50 flex items-center justify-center mx-auto text-amber-400 text-3xl font-black shadow-xl overflow-hidden" id="tienda-avatar-container">
          <i class="fa-solid fa-store" id="tienda-avatar-icon"></i>
        </div>

        <div>
          <h1 id="tienda-nombre" class="text-xl font-black text-amber-400">Cargando...</h1>
          <p id="tienda-desc" class="text-xs text-slate-400 mt-0.5">...</p>
        </div>

        <!-- Botones de Acción (Admin, Crear Tienda, Difundir) -->
        <div class="grid grid-cols-3 gap-2 pt-1">
          <a href="admin.html" target="_blank" class="bg-slate-950 hover:bg-slate-900 border border-amber-500/30 text-amber-400 text-xs py-2.5 rounded-2xl font-bold flex items-center justify-center gap-1 shadow transition">
            <i class="fa-solid fa-gear"></i> Admin
          </a>
          <a href="registro.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2.5 rounded-2xl font-bold flex items-center justify-center gap-1 shadow transition">
            <i class="fa-solid fa-store"></i> Crear Tienda
          </a>
          <a id="link-whatsapp-tienda" href="#" target="_blank" class="bg-slate-950 hover:bg-slate-900 border border-slate-800 text-slate-200 text-xs py-2.5 rounded-2xl font-bold flex items-center justify-center gap-1 shadow transition">
            <i class="fa-solid fa-share-nodes text-cyan-400"></i> Difundir
          </a>
        </div>
      </div>
    </div>

    <!-- SECCIÓN "OTROS NEGOCIOS" (CARRUSEL HORIZONTAL) -->
    <div class="space-y-2 pt-1">
      <div class="flex justify-between items-center px-1">
        <span class="text-[11px] font-black text-cyan-400 uppercase tracking-wider flex items-center gap-1">
          <i class="fa-solid fa-bolt text-amber-400"></i> OTROS NEGOCIOS
        </span>
        <a href="directorio.html" class="text-[10px] text-amber-400 hover:underline font-bold">Ver Directorio ></a>
      </div>
      
      <div id="carrusel-otros-negocios" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
        <div class="text-xs text-slate-500 py-3 px-4">Cargando negocios...</div>
      </div>
    </div>

    <!-- FILTROS DE CATEGORÍAS DE PRODUCTOS -->
    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar pt-2">
      <button onclick="filtrarCatProductos('todos')" id="btn-cat-todos" class="px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950 shrink-0 transition">🔥 Todos</button>
      <button onclick="filtrarCatProductos('Confituras')" id="btn-cat-Confituras" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">CONFITURAS</button>
      <button onclick="filtrarCatProductos('Comida')" id="btn-cat-Comida" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">COMIDA</button>
      <button onclick="filtrarCatProductos('Bebidas')" id="btn-cat-Bebidas" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">BEBIDAS</button>
      <button onclick="filtrarCatProductos('Aseo')" id="btn-cat-Aseo" class="px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition">ASEO</button>
    </div>

    <!-- GRID DE PRODUCTOS (ESTÉTICA IDÉNTICA A TUS FOTOS) -->
    <div id="grid-productos" class="grid grid-cols-2 gap-3 pt-1">
      <div class="col-span-2 text-center py-12 text-slate-500 text-xs">Cargando productos...</div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://qhkqznpgjirvnndriehr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Ih_3RgWJTptRasXqF9UcxQ_eTkkw7j-";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let productosTiendaActual = [];
    let categoriaActual = 'todos';
    let whatsappTiendaGlobal = '';

    const urlParams = new URLSearchParams(window.location.search);
    let slugTienda = urlParams.get('tienda');

    window.onload = async () => {
      if (!slugTienda) {
        slugTienda = 'tupunto'; 
      }
      await cargarTiendaIndividual(slugTienda);
    };

    async function cargarTiendaIndividual(slug) {
      let { data: negocio, error } = await supabaseClient
        .from('negocios')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !negocio) {
        const { data: listado } = await supabaseClient
          .from('negocios')
          .select('*')
          .eq('activo', true)
          .limit(1);
        
        if (listado && listado.length > 0) {
          negocio = listado[0];
        } else {
          document.getElementById("tienda-nombre").innerText = "Tienda no encontrada";
          document.getElementById("tienda-desc").innerText = "Verifica el enlace o crea una tienda.";
          return;
        }
      }

      document.getElementById("tienda-nombre").innerText = negocio.nombre;
      document.getElementById("tienda-desc").innerText = negocio.descripcion || negocio.municipio || 'Ciego de Ávila';

      if (negocio.portada_url) {
        const imgPortada = document.getElementById("tienda-portada");
        imgPortada.src = negocio.portada_url;
        imgPortada.classList.remove("hidden");
        document.getElementById("tienda-portada-placeholder").classList.add("hidden");
      }

      if (negocio.logo_url) {
        document.getElementById("tienda-avatar-container").innerHTML = `<img src="${negocio.logo_url}" class="w-full h-full object-cover rounded-2xl" alt="Logo">`;
      } else {
        document.getElementById("tienda-avatar-icon").className = "fa-solid fa-store";
      }

      if (negocio.telefono_whatsapp) {
        whatsappTiendaGlobal = negocio.telefono_whatsapp;
        document.getElementById("link-whatsapp-tienda").href = `https://wa.me/${negocio.telefono_whatsapp}?text=Hola,%20vengo%20de%20OFERTAZO%20y%20quiero%20información.`;
      } else {
        document.getElementById("link-whatsapp-tienda").style.display = 'none';
      }

      cargarProductosTienda(negocio.id);
      cargarCarruselOtrosNegocios(negocio.id);
    }

    async function cargarCarruselOtrosNegocios(currentId) {
      const { data } = await supabaseClient
        .from('negocios')
        .select('*')
        .eq('activo', true)
        .neq('id', currentId)
        .limit(6);

      const cont = document.getElementById("carrusel-otros-negocios");
      if (!data || data.length === 0) {
        cont.innerHTML = '<span class="text-xs text-slate-500 py-2">No hay más negocios.</span>';
        return;
      }

      let html = '';
      data.forEach(n => {
        const logoHtml = n.logo_url 
          ? `<img src="${n.logo_url}" class="w-full h-full object-cover">` 
          : `<div class="w-full h-full bg-slate-900 flex items-center justify-center text-amber-400 font-bold">${n.nombre.charAt(0)}</div>`;

        html += `
          <a href="index.html?tienda=${n.slug}" class="bg-slate-900 border border-slate-800 hover:border-amber-400/60 rounded-2xl p-2.5 shrink-0 w-32 text-center space-y-1.5 shadow transition">
            <div class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-800 mx-auto overflow-hidden shadow-inner flex items-center justify-center">
              ${logoHtml}
            </div>
            <h4 class="text-xs font-bold text-white truncate">${n.nombre}</h4>
            <span class="text-[9px] text-amber-400 font-black tracking-wider block">VER TIENDA</span>
          </a>
        `;
      });
      cont.innerHTML = html;
    }

    async function cargarProductosTienda(negocioId) {
      const { data, error } = await supabaseClient
        .from('productos')
        .select('*')
        .eq('negocio_id', negocioId)
        .order('id', { ascending: false });

      if (error) {
        document.getElementById("grid-productos").innerHTML = '<div class="col-span-2 text-center text-red-400 text-xs">Error cargando productos.</div>';
        return;
      }

      productosTiendaActual = data || [];
      renderizarProductos(productosTiendaActual);
    }

    function renderizarProductos(lista) {
      const grid = document.getElementById("grid-productos");
      if (lista.length === 0) {
        grid.innerHTML = '<div class="col-span-2 text-center text-slate-500 text-xs py-12">No hay productos en este catálogo.</div>';
        return;
      }

      let html = '';
      lista.forEach(p => {
        const cat = p.categoria ? p.categoria.toUpperCase() : 'GENERAL';
        const badge = `<span class="absolute top-2.5 left-2.5 bg-slate-950/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-[9px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">${cat}</span>`;
        
        // Calcular o mostrar precio USD aproximado si no viene en base de datos (asumiendo tasa estimada o campo USD si existe)
        const precioCUP = Number(p.precio) || 0;
        const precioUSD = p.precio_usd ? `$${p.precio_usd} USD` : `≈ $${(precioCUP / 790).toFixed(2)} USD`; // Ajusta o usa tu lógica

        const isAgota = p.stock === 0 || p.agotado === true;

        let botonAccion = isAgota 
          ? `<div class="w-full bg-slate-950 text-slate-500 font-bold py-2 rounded-xl text-xs text-center border border-slate-800">Agotado</div>`
          : `<button onclick="agregarAlPedido('${p.nombre.replace(/'/g, "\\'")}', '${precioCUP}')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-xl text-xs text-center shadow active:scale-95 transition flex items-center justify-center gap-1">
               <i class="fa-solid fa-plus"></i> Agregar
             </button>`;

        html += `
          <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-3xl p-3.5 space-y-3 shadow-md relative flex flex-col justify-between ${isAgota ? 'opacity-70' : ''}">
            <div class="relative">
              ${p.imagen_url ? `<img src="${p.imagen_url}" class="w-full h-36 object-cover rounded-2xl" alt="Producto">` : `<div class="w-full h-36 bg-slate-950 rounded-2xl flex items-center justify-center text-slate-700"><i class="fa-solid fa-box text-3xl"></i></div>`}
              ${badge}
            </div>
            
            <div class="space-y-1.5">
              <h3 class="text-xs font-bold text-white line-clamp-2 leading-tight">${p.nombre}</h3>
              <div>
                <div class="text-sm font-black text-amber-400 tracking-wide">$${precioCUP.toLocaleString()} <span class="text-[10px] font-semibold text-slate-400">CUP</span></div>
                <div class="text-[10px] text-slate-400 font-medium">${precioUSD}</div>
              </div>
            </div>

            <div class="pt-1">
              ${botonAccion}
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function filtrarCatProductos(cat) {
      categoriaActual = cat;
      ['todos', 'Confituras', 'Comida', 'Bebidas', 'Aseo'].forEach(c => {
        const btn = document.getElementById(`btn-cat-${c}`);
        if(btn) {
          if(c === cat) {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500 text-slate-950 shrink-0 transition";
          } else {
            btn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 border border-slate-800 shrink-0 transition";
          }
        }
      });

      if(cat === 'todos') {
        renderizarProductos(productosTiendaActual);
      } else {
        const filtrados = productosTiendaActual.filter(p => p.categoria && p.categoria.toLowerCase() === cat.toLowerCase());
        renderizarProductos(filtrados);
      }
    }

    function agregarAlPedido(nombre, precio) {
      if(whatsappTiendaGlobal) {
        const mensaje = `Hola, quiero encargar: *${nombre}* por un valor de *$${precio} CUP*.`;
        window.open(`https://wa.me/${whatsappTiendaGlobal}?text=${encodeURIComponent(mensaje)}`, '_blank');
      } else {
        alert(`¡Producto "${nombre}" seleccionado!`);
      }
    }
  </script>
</body>
</html>
